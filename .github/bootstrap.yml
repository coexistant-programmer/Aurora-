name: Bootstrap Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "GRADLE_BIN=$PWD/gradle-8.7/bin/gradle" >> $GITHUB_ENV

      - name: Generate wrapper in isolated directory
        run: |
          mkdir -p /tmp/wrap && cd /tmp/wrap
          touch settings.gradle
          "$GRADLE_BIN" wrapper --gradle-version 8.7
          cp -r gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Gradle wrapper (generated by CI)"
            git push
          fi
